name: Update profile projects

on:
  schedule:
    # Daily at 09:17 Asia/Shanghai (01:17 UTC). GitHub may delay scheduled jobs.
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-projects.cjs'
      - 'tests/update-projects.test.cjs'
      - '.github/workflows/update-projects.yml'
      - 'README.md'

# The ephemeral built-in token can update this profile repository only.
permissions:
  contents: write

concurrency:
  group: profile-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test project rendering and safe updates
        run: node --test tests/update-projects.test.cjs
      - name: Refresh public projects
        uses: actions/github-script@v9
        with:
          script: |
            const update = require('./scripts/update-projects.cjs');
            await update({ github, context, core });
